# ============================================================
# n8n Nginx Reverse Proxy Configuration
# Replace YOUR_DOMAIN with your actual domain, e.g. n8n.example.com
# ============================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow Let's Encrypt certificate renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # ------------------------------------------------------------
    # SSL Certificate Paths (filled in by Certbot automatically)
    # ------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    # ------------------------------------------------------------
    # SSL Hardening
    # ------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling — speeds up handshake and improves privacy
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman parameter (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096)
    # Uncomment the line below after generating the file:
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # ------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------

    # Prevent browsers from MIME-sniffing the content type
    add_header X-Content-Type-Options "nosniff" always;

    # Protect against Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Enable browser XSS filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Force HTTPS for 1 year, including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Control what the browser sends in the Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict powerful browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — allows n8n UI and WebSocket connections
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://YOUR_DOMAIN https://YOUR_DOMAIN; frame-ancestors 'self';" always;

    # ------------------------------------------------------------
    # Rate Limiting (protects against brute-force and scraping)
    # ------------------------------------------------------------
    # These zones must be declared at the http{} level.
    # They are referenced here — see the note at the bottom of this file.
    limit_req zone=n8n_limit burst=100 nodelay;
    limit_conn conn_limit 50;

    # ------------------------------------------------------------
    # Request Size & Timeout Limits
    # ------------------------------------------------------------
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Hide Nginx version from error pages and headers
    server_tokens off;

    # ------------------------------------------------------------
    # Proxy to n8n (running on port 5678 via Docker)
    # ------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5678;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for n8n push/websocket notifications
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts — n8n workflows can be long-running
        proxy_read_timeout    3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;

        # Buffer settings
        proxy_buffering    off;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # Block access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------
    access_log /var/log/nginx/n8n_access.log;
    error_log  /var/log/nginx/n8n_error.log warn;
}


# ============================================================
# IMPORTANT — Add the following inside the http{} block of
# /etc/nginx/nginx.conf (not in this file):
#
#   limit_req_zone  $binary_remote_addr zone=n8n_limit:10m rate=10r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
#
# These define the rate-limit memory zones referenced above.
# ============================================================
